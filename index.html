<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Semaine</title>
  <meta name="theme-color" content="#E4EEF6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semaine">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <div id="weekView">

    <header class="greet">
      <div>
        <p class="greet-hello">
          <span id="greetWord"></span><span id="greetName" class="greet-name"></span>
        </p>
        <p id="greetSub" class="greet-sub"></p>
      </div>
      <button id="profileBtn" class="avatar-btn" aria-label="Profil">
        <span id="avatarEmoji"></span>
      </button>
    </header>

    <header class="header">
      <h1 id="monthLabel" class="month"></h1>
      <div class="header-actions">
        <button id="todayBtn" class="today-btn" hidden>Aujourd'hui</button>
        <button id="prevWeek" class="icon-btn" aria-label="Semaine précédente">
          <svg viewBox="0 0 24 24"><path d="M14.5 6.5 9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="nextWeek" class="icon-btn" aria-label="Semaine suivante">
          <svg viewBox="0 0 24 24"><path d="M9.5 6.5 15 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <nav id="weekStrip" class="week-strip" aria-label="Jours de la semaine"></nav>

    <p id="dayLabel" class="day-label"></p>

    <section id="planList" class="plan-list"></section>

    </div>

    <div id="upcomingView" hidden>
      <header class="header">
        <h1 class="month">À venir</h1>
      </header>
      <section id="upcomingList" class="plan-list"></section>
    </div>

    <div id="enviesView" hidden>
      <header class="header">
        <h1 class="month">Envies</h1>
      </header>
      <p class="view-sub">La boîte à idées, sans date. Planifie-les quand tu veux.</p>
      <form id="envieForm" class="envie-form" autocomplete="off">
        <input id="envieInput" class="field" type="text" placeholder="Une envie…" maxlength="60" required>
        <button type="submit" class="envie-add" aria-label="Ajouter l'envie">
          <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </form>
      <section id="envieList" class="plan-list"></section>
    </div>

  </main>

  <div id="toast" class="toast" hidden></div>

  <nav class="navbar" aria-label="Navigation">
    <button id="navWeek" class="nav-btn active" aria-label="Semaine">
      <svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M8.5 3.5v3.5M15.5 3.5v3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button id="navEnvies" class="nav-btn" aria-label="Envies">
      <svg viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3M12 3.5a5.5 5.5 0 0 0-3 10.1c.8.55 1.5 1.4 1.5 2.4h3c0-1 .7-1.85 1.5-2.4a5.5 5.5 0 0 0-3-10.1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="addBtn" class="nav-add" aria-label="Ajouter">
      <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button id="navUpcoming" class="nav-btn" aria-label="À venir">
      <svg viewBox="0 0 24 24"><path d="M5 6.5h14M5 12h14M5 17.5h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </nav>

  <div id="onboard" class="onboard" hidden>

    <div id="obStep1" class="onboard-inner">
      <div class="onboard-preview">
        <svg viewBox="0 0 48 48"><circle cx="19" cy="24" r="11" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="31" cy="24" r="11" fill="#374785"/></svg>
      </div>
      <h2 class="onboard-title">Bienvenue</h2>
      <p class="onboard-sub">Comment tu t'appelles ?</p>
      <input id="obName" class="field field-title" type="text" placeholder="Prénom" maxlength="20" autocomplete="off">
      <button id="obNext" class="btn btn-primary onboard-btn">Continuer</button>
    </div>

    <div id="obStep2" class="onboard-inner" hidden>
      <div id="obAvatar" class="ob-avatar"></div>
      <h2 class="onboard-title">Ton avatar</h2>
      <div id="builder" class="builder"></div>
      <div id="obInvite" hidden>
        <p class="builder-label">Deuxième téléphone</p>
        <button id="inviteBtn" class="btn btn-secondary duo-btn" type="button">Inviter l'autre téléphone</button>
      </div>
      <button id="obDone" class="btn btn-primary onboard-btn">Commencer</button>
    </div>

  </div>

  <div id="overlay" class="overlay" hidden></div>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <form id="planForm" autocomplete="off">
      <input id="fTitle" class="field field-title" type="text" placeholder="Titre" maxlength="60" required>

      <div class="field-row">
        <label class="field field-half">
          <span class="field-label">Début</span>
          <input id="fStart" type="time" required>
        </label>
        <label class="field field-half">
          <span class="field-label">Fin</span>
          <input id="fEnd" type="time">
        </label>
      </div>

      <label class="field">
        <span class="field-label">Jour</span>
        <input id="fDate" type="date" required>
      </label>

      <input id="fNote" class="field" type="text" placeholder="Note (optionnel)" maxlength="120">

      <div class="color-row" id="colorRow" role="radiogroup" aria-label="Couleur"></div>

      <div class="sheet-actions">
        <button type="button" id="deleteBtn" class="btn btn-danger" hidden>Supprimer</button>
        <button type="submit" id="saveBtn" class="btn btn-primary">Ajouter</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
